services:
  - type: web
    name: qr-order-backend
    env: docker
    region: oregon
    plan: free
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false # Set this manually in Render dashboard to your Supabase URL
